<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="phoneform" novalidate>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel"
            placeholder="+7 (___) ___-__-__" maxlength="18">
        <span id="phoneError" style="color: red"></span>
        <button type="submit">Send</button>
    </form>
    <script>
        PHONE_RU_REGEX = /^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$/
        const input = document.getElementById('phone')
        const errorE1 = document.getElementById('phoneError')
        function extractDigits(value) {
            let digits = value.replace(/\D/g, '');

            if (digits.startsWith('8')) digits = '7' + digits.slice(1);
            if (digits.length > 0 && digits[0] !== '7') digits = '7' + digits;

            return digits.slice(0, 11);
        }
        function formalPhoneRu(digits) {
            const d = digits.slice(1);
            let out = '+7';

            if (d.length > 0) out += ' (' + d.slice(0, 3);
            if (d.length >= 3) out += ') ';
            if (d.length > 3) out += '' + d.slice(3, 6);
            if (d.length > 6) out += '-' + d.slice(6, 8);
            if (d.length > 8) out += '-' + d.slice(8, 10);

            return out;
        }

        input.addEventListener('input', (e) => {
            const MIN_CURSOR = 4;

            const digitsBefore = input.value.slice(0, input.selectionStart).replace(/\D/g, '').length;

            const formatted = formalPhoneRu(extractDigits(e.target.value));
            input.value = formatted;

            let seen = 0; pos = 0;
            for (let i = 0; i < formatted.length && seen < digitsBefore; i++) {
                if (/\d/.test(formatted[i])) seen++;
                pos = i + 1;
            }

            input.setSelectionRange(Math.min(pos, MIN_CURSOR));
        });
        document.getElementById('phoneform').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorE1.textContent = '';

            const value = input.value.trim();

            if (!PHONE_RU_REGEX.test(value)) {
                errorE1.textContent = "Input a phone number";
                input.focus();
                return
            }

            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: value })
            })

            if (!res.ok) {
                const data = await
                    res.json().catch(() => { { } });
                errorE1.textContent = data.error || 'Server error'
            }
        })
    </script>
</body>

</html>
